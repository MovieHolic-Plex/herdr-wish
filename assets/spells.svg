<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-label="wish and omo-10">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1228"/>
      <stop offset="100%" stop-color="#100818"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="260" fill="none"/>

  <rect x="8" y="8" width="528" height="244" rx="22" fill="url(#card)" stroke="#d4a24a" stroke-width="2"/>
  <text x="40" y="58" fill="#ffd56a" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="4">SPELL 01</text>
  <text x="40" y="104" fill="#fff6d6" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700">wish</text>
  <text x="40" y="148" fill="#e8d7ff" font-family="Georgia, Times New Roman, serif" font-size="18">one worktree  ·  one omo  ·  one PR</text>
  <text x="40" y="188" fill="#9b8bb0" font-family="ui-monospace, Consolas, monospace" font-size="15">/wish + commit and make pr</text>
  <text x="40" y="220" fill="#f0c36a" font-family="ui-monospace, Consolas, monospace" font-size="14">prefix+shift+e</text>

  <rect x="564" y="8" width="528" height="244" rx="22" fill="url(#card)" stroke="#c084fc" stroke-width="2"/>
  <text x="596" y="58" fill="#e9d5ff" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="4">SPELL 02</text>
  <text x="596" y="104" fill="#f5e1ff" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700">omo-10</text>
  <text x="596" y="148" fill="#e8d7ff" font-family="Georgia, Times New Roman, serif" font-size="18">ten worktrees  ·  ten omo  ·  go</text>
  <text x="596" y="188" fill="#9b8bb0" font-family="ui-monospace, Consolas, monospace" font-size="15">omo-1 ... omo-10</text>
  <text x="596" y="220" fill="#c084fc" font-family="ui-monospace, Consolas, monospace" font-size="14">prefix+shift+w</text>
</svg>
