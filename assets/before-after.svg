  <text x="592" y="142" fill="#e8d7ff" font-family="Georgia, Times New Roman, serif" font-size="18">Enter. Isolated tree. PR.</text>
  <text x="592" y="176" fill="#9b8bb0" font-family="ui-monospace, Consolas, monospace" font-size="14">four steps become one box</text>
</svg>
